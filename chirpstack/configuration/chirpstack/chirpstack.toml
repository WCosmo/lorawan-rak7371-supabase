# =============================================================================
# ChirpStack v4 - Configuração Completa
# RAK7371 + AU915 (Brasil/ANATEL) + MQTT → Supabase
# =============================================================================

[logging]
  level = "info"
  json = false
  flatten_json = false

[postgresql]
  dsn = "postgres://chirpstack:chirpstack@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections = 10
  min_idle_connections = 0
  ca_cert = ""
  connection_recycling_method = "verified"

[redis]
  servers = ["redis://$REDIS_HOST/"]
  cluster = false
  key_prefix = ""
  max_open_connections = 100

[api]
  bind = "0.0.0.0:8080"
  secret = "$CHIRPSTACK_SECRET"

[gateway]
  ca_cert = ""
  ca_key = ""
  client_cert_lifetime = "11months 30days 3h 50m 24s"
  allow_unknown_gateways = false
  rx_timestamp_max_drift = "30s"
  device_gateway_mapping_history_uplinks = 1

[network]
  net_id = "000000"
  secondary_net_ids = []
  enabled_regions = ["$LORAWAN_REGION"]

[integration]
  enabled = ["mqtt"]

  [integration.mqtt]
    server = "tcp://$MQTT_BROKER_HOST:1883/"
    json = true

[[regions]]
  id = "au915_0"
  description = "AU915 (channels 0-7 + 64) - Brazil ANATEL"
  common_name = "AU915"
  user_info = """
# Região AU915 - Brasil (ANATEL)

Canais de uplink:
- 915.2, 915.4, 915.6, 915.8, 916.0, 916.2, 916.4, 916.6 MHz (125kHz, DR0-DR5)
- 915.9 MHz (500kHz, DR8)

Downlink RX2: 923.3 MHz / DR8
"""

  [regions.gateway]
    force_gws_private = false

    [regions.gateway.backend]
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]
        topic_prefix = "au915_0"
        share_name = "chirpstack"
        server = "tcp://$MQTT_BROKER_HOST:1883"
        username = ""
        password = ""
        qos = 0
        clean_session = false
        session_expiry_interval = "0s"
        client_id = ""
        keep_alive_interval = "30s"
        ca_cert = ""
        tls_cert = ""
        tls_key = ""

  [[regions.gateway.channels]]
    frequency = 915200000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 915400000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 915600000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 915800000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 916000000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 916200000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 916400000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 916600000
    bandwidth = 125000
    modulation = "LORA"
    spreading_factors = [7, 8, 9, 10, 11, 12]

  [[regions.gateway.channels]]
    frequency = 915900000
    bandwidth = 500000
    modulation = "LORA"
    spreading_factors = [8]

  [regions.network]
    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 8
    rx2_frequency = 923300000
    rx2_prefer_on_rx1_dr_lt = 0
    rx2_prefer_on_link_budget = false
    downlink_tx_power = -1
    adr_disabled = false
    min_dr = 0
    max_dr = 5
    enabled_uplink_channels = [0, 1, 2, 3, 4, 5, 6, 7, 64]

    [regions.network.rejoin_request]
      enabled = false
      max_count_n = 0
      max_time_n = 0

    [regions.network.class_b]
      ping_slot_dr = 8
      ping_slot_frequency = 0
